name: release

# oaica is a thin, CGO-free client: every platform cross-compiles from one
# Linux runner via scripts/build_oaica.sh. The upstream Ollama release
# workflow this replaces (darwin/windows native toolchains, CUDA/ROCm docker
# images, Inno Setup) built an inference server this fork does not ship and
# had never run successfully here.
#
# Tag scheme: oaica-v<semver>. Plain v* tags are upstream Ollama's and
# already exist in this repo (v0.3.0, v0.32.5, ...), so they cannot name
# fork releases.
on:
  push:
    tags:
      - 'oaica-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all platform archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd zip
          export VERSION="${VERSION#oaica-v}"
          OUT=dist scripts/build_oaica.sh
          cp scripts/install.sh scripts/install.ps1 dist/
      - name: Verify release artifacts
        run: |
          set -e
          for f in oaica-linux-amd64.tar.zst oaica-linux-amd64.tgz \
                   oaica-linux-arm64.tar.zst oaica-linux-arm64.tgz \
                   oaica-darwin-amd64.zip oaica-darwin-arm64.zip \
                   oaica-windows-amd64.zip SHA256SUMS install.sh install.ps1; do
            [ -s "dist/$f" ] || { echo "missing dist/$f"; exit 1; }
          done
          ls -l dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "oaica ${GITHUB_REF_NAME#oaica-v}" \
            --generate-notes \
            dist/*
