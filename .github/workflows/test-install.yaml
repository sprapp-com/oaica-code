name: test-install

on:
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/tests/install_checksum_test.sh'
      - '.github/workflows/test-install.yaml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test download verification and retry against a local server
        run: bash scripts/tests/install_checksum_test.sh
      - name: Run the real installer against oaica.com
        run: sh ./scripts/install.sh
      - name: Verify oaica is available
        run: oaica --version
