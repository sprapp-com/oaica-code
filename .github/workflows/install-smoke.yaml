name: install-smoke

# Installs the *published* release the way a new user does, on all three
# platforms, and asserts the installed binary reports the version the release
# claims. This is the drift detector: the fork's history includes a tag
# (oaica-v0.5.46) whose served artifact was 0.5.45 for two weeks, and nothing
# noticed until someone installed it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'site/install.sh'
      - 'site/install.ps1'
      - 'scripts/tests/install_checksum_test.sh'
      - '.github/workflows/install-smoke.yaml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'site/install.sh'
      - 'site/install.ps1'
      - 'scripts/tests/install_checksum_test.sh'
      - '.github/workflows/install-smoke.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Installer helpers (checksum, retry, URL base, copy drift)
        if: runner.os != 'Windows'
        run: bash scripts/tests/install_checksum_test.sh

      - name: Read the published version (unix)
        if: runner.os != 'Windows'
        id: published
        run: |
          curl -fsSL "https://github.com/sprapp-com/oaica-code/releases/latest/download/VERSION.txt" -o "$RUNNER_TEMP/VERSION.txt"
          echo "version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/VERSION.txt")" >> "$GITHUB_OUTPUT"

      - name: Read the published version (windows)
        if: runner.os == 'Windows'
        id: published_win
        shell: pwsh
        run: |
          $txt = Invoke-RestMethod -Uri "https://github.com/sprapp-com/oaica-code/releases/latest/download/VERSION.txt"
          $version = (($txt -split "`n" | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      # Install, then assert the installed binary is the version the release
      # says. The assertion runs in the same step as the install: the
      # installer only edits the PATH of the process it runs in.
      - name: Install from the release and check version (unix)
        if: runner.os != 'Windows'
        env:
          # The version the latest release claims, read from its own
          # VERSION.txt. Step-level, not job-level: the `steps` context does
          # not exist in a job's `env`, so a job-level EXPECTED is either
          # rejected by the linter or silently empty (2026-09-26 audit).
          EXPECTED: ${{ steps.published.outputs.version }}
        run: |
          set -eu
          [ -n "$EXPECTED" ] || { echo "::error::could not read the latest release's VERSION.txt"; exit 1; }
          curl -fsSL "https://github.com/sprapp-com/oaica-code/releases/latest/download/install.sh" | sh
          oaica --version
          got="$(oaica --version | awk '{print $NF}')"
          echo "installed=$got published=$EXPECTED"
          [ "$EXPECTED" = "$got" ] || {
            echo "::error::installed $got but the latest release is $EXPECTED — the install path is serving a stale artifact"
            exit 1
          }

      - name: Install from the release and check version (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED: ${{ steps.published_win.outputs.version }}
        run: |
          if (-not $env:EXPECTED -or -not $env:EXPECTED.Trim()) {
            Write-Host "::error::could not read the latest release's VERSION.txt"
            exit 1
          }
          irm "https://github.com/sprapp-com/oaica-code/releases/latest/download/install.ps1" | iex
          oaica --version
          $got = (oaica --version) -replace '^oaica\s+', ''
          Write-Host "installed=$got published=$env:EXPECTED"
          if ($got.Trim() -ne $env:EXPECTED.Trim()) {
            Write-Host "::error::installed $got but the latest release is $($env:EXPECTED) - the install path is serving a stale artifact"
            exit 1
          }

      # The release assets are the documented install path (README.md), and the
      # steps above prove they work. oaica.com serves a PUBLISHED COPY of
      # install.sh/install.ps1 that is refreshed by a manual Cloudflare Pages
      # deploy, so it can lag a release by exactly as long as nobody runs one —
      # it is currently behind, and this step is what makes that visible
      # without failing the build on an artifact only a deploy can fix
      # (2026-09-26 audit).
      - name: Check the oaica.com mirror is current (unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          set -eu
          live="$(curl -fsSL https://oaica.com/install.sh | grep -c 'releases.*download' || true)"
          if [ "$live" -eq 0 ]; then
            echo "::warning::oaica.com/install.sh still fetches from oaica.com/download instead of the release — a Pages deploy of site/ is pending, so the mirror serves a stale installer"
          fi
