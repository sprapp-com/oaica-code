name: install-smoke

# Installs the *published* release the way a new user does, on all three
# platforms, and asserts the installed binary reports the version the release
# claims. This is the drift detector: the fork's history includes a tag
# (oaica-v0.5.46) whose served artifact was 0.5.45 for two weeks, and nothing
# noticed until someone installed it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'site/install.sh'
      - 'site/install.ps1'
      - 'scripts/tests/install_checksum_test.sh'
      - '.github/workflows/install-smoke.yaml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'site/install.sh'
      - 'site/install.ps1'
      - 'scripts/tests/install_checksum_test.sh'
      - '.github/workflows/install-smoke.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The version the latest release claims, read from its own VERSION.txt.
      EXPECTED: ${{ steps.published.outputs.version || steps.published_win.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Installer helpers (checksum, retry, URL base, copy drift)
        if: runner.os != 'Windows'
        run: bash scripts/tests/install_checksum_test.sh

      - name: Read the published version (unix)
        if: runner.os != 'Windows'
        id: published
        run: |
          curl -fsSL "https://github.com/sprapp-com/oaica-code/releases/latest/download/VERSION.txt" -o "$RUNNER_TEMP/VERSION.txt"
          echo "version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/VERSION.txt")" >> "$GITHUB_OUTPUT"

      - name: Read the published version (windows)
        if: runner.os == 'Windows'
        id: published_win
        shell: pwsh
        run: |
          $txt = Invoke-RestMethod -Uri "https://github.com/sprapp-com/oaica-code/releases/latest/download/VERSION.txt"
          $version = (($txt -split "`n" | Where-Object { $_ -match '^version=' }) -replace '^version=', '').Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      # Install, then assert the installed binary is the version the release
      # says. The assertion runs in the same step as the install: the
      # installer only edits the PATH of the process it runs in.
      - name: Install from oaica.com and check version (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          curl -fsSL https://oaica.com/install.sh | sh
          oaica --version
          got="$(oaica --version | awk '{print $NF}')"
          echo "installed=$got published=$EXPECTED"
          [ "$EXPECTED" = "$got" ] || {
            echo "::error::installed $got but the latest release is $EXPECTED — the install path is serving a stale artifact"
            exit 1
          }

      - name: Install from oaica.com and check version (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://oaica.com/install.ps1 | iex
          oaica --version
          $got = (oaica --version) -replace '^oaica\s+', ''
          Write-Host "installed=$got published=$env:EXPECTED"
          if ($got.Trim() -ne $env:EXPECTED.Trim()) {
            Write-Host "::error::installed $got but the latest release is $($env:EXPECTED) - the install path is serving a stale artifact"
            exit 1
          }
